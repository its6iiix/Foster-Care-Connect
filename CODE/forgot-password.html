<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - FosterCare Connect</title>
    <style>
        body { background: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px; box-sizing: border-box; }
        .card { background: #fff; border-radius: 10px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        h2 { color: #301934; margin: 0 0 6px 0; }
        .sub { color: #6c757d; font-size: 13px; margin-bottom: 22px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #495057; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #301934; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px; }
        .btn:hover { background: #452449; }
        #message { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
        .back-link { text-align: center; margin-top: 16px; font-size: 13px; }
        .back-link a { color: #301934; font-weight: 600; text-decoration: none; }
    </style>
    <link rel="stylesheet" href="fostercare-ui.css">
</head>
<body>
    <div class="card">
        <h2>Forgot Password</h2>
        <p class="sub">Enter your account email and we'll send a reset link (this demo environment prints it to the server terminal instead of a real inbox).</p>

        <form id="forgotForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="fpEmail" required>
            </div>
            <button type="submit" class="btn">Send Reset Link</button>
            <div id="message"></div>
        </form>

        <div class="back-link"><a href="login.html">Back to Login</a></div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('message');
            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('fpEmail').value })
                });
                const data = await res.json();
                msg.style.color = '#2b8a3e';
                msg.textContent = data.message || 'If that email exists, a reset link has been sent. Check the server terminal.';
            } catch (err) {
                console.error(err);
                msg.style.color = '#c92a2a';
                msg.textContent = 'Could not reach the server.';
            }
        });
    </script>
</body>
</html>
